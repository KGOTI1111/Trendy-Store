<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy Store | Wishlist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #121212;
            --accent: #b89047;
            --bg: #fbfbfd;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            --transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f9efe2 0%, var(--bg) 100%); color: var(--text-main); min-height: 100vh; }
        nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--primary); text-decoration: none; letter-spacing: 1px; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover { color: var(--accent); }
        .page { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }
        .page h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 10px; }
        .page p { color: var(--text-muted); margin-bottom: 30px; }
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .wishlist-card { background: var(--card-bg); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; }
        .wishlist-card img { width: 100%; height: 260px; object-fit: cover; }
        .wishlist-content { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .wishlist-content h2 { font-size: 20px; margin: 0; }
        .wishlist-content .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--text-muted); font-size: 13px; }
        .wishlist-content .price { color: var(--accent); font-weight: 800; font-size: 18px; }
        .wishlist-content p { color: #444; line-height: 1.6; font-size: 14px; }
        .wishlist-actions { margin-top: auto; display: flex; justify-content: space-between; gap: 12px; }
        .wishlist-btn { flex: 1; padding: 12px 16px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-remove { background: #f3f3f3; color: var(--text-main); }
        .btn-remove:hover { background: #e8e8e8; }
        .btn-back { background: var(--primary); color: white; }
        .btn-back:hover { background: var(--accent); }
        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 22px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.06); }
        .custom-alert { position: fixed; bottom: 30px; right: 30px; background: #121212; color: white; padding: 16px 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 3000; display: none; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; border-left: 4px solid var(--accent); animation: slideInUp 0.4s ease; }
        @keyframes slideInUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @media (max-width: 760px) { .wishlist-actions { flex-direction: column; } }
    </style>
</head>
<body>
    <nav>
        <a href="./index.html" class="logo">Trendy Store<span></span></a>
        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./login.html">Login</a>
            <a href="./profile.html">Profile</a>
        </div>
    </nav>

    <main class="page">
        <h1>Your Wishlist</h1>
        <p>Items you marked as favorites are saved here. You can remove products or return to shopping anytime.</p>
        <div class="wishlist-grid" id="wishlistGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <h2>Your wishlist is empty</h2>
            <p>Add products from the store to see them here and save your favorites.</p>
            <button class="wishlist-btn btn-back" onclick="window.location.href='./index.html'">Browse Products</button>
        </div>
    </main>

    <div class="custom-alert" id="customAlert">
        <i class="fas fa-info-circle" style="color: var(--accent);"></i>
        <span id="alertMsg">Message goes here</span>
    </div>

    <script>
        const wishlistGrid = document.getElementById('wishlistGrid');
        const emptyState = document.getElementById('emptyState');

        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            document.getElementById('alertMsg').innerText = message;
            alertBox.style.display = 'flex';
            setTimeout(() => { alertBox.style.display = 'none'; }, 2500);
        }

        function getWishlist() {
            return JSON.parse(localStorage.getItem('wishlist') || '[]');
        }

        function saveWishlist(items) {
            localStorage.setItem('wishlist', JSON.stringify(items));
            renderWishlist();
        }

        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }

        function saveCart(items) {
            localStorage.setItem('cart', JSON.stringify(items));
        }

        function addToCart(productOrId) {
            const product = typeof productOrId === 'number'
                ? getWishlist().find(item => item.id === productOrId)
                : productOrId;
            if (!product) {
                showAlert('Unable to add this product to cart.');
                return;
            }
            const cart = getCart();
            if (cart.some(item => item.id === product.id)) {
                showAlert(`"${product.name}" is already in your cart.`);
                return;
            }
            cart.push(product);
            saveCart(cart);
            removeFromWishlist(product.id);
            showAlert(`"${product.name}" added to cart.`);
            setTimeout(() => {
                window.location.href = './index.html';
            }, 700);
        }

        function removeFromWishlist(id) {
            const updated = getWishlist().filter(item => item.id !== id);
            saveWishlist(updated);
            showAlert('Product removed from your Wishlist.');
        }

        function renderWishlist() {
            const wishlist = getWishlist();
            wishlistGrid.innerHTML = '';
            if (!wishlist.length) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            wishlist.forEach(product => {
                const card = document.createElement('div');
                card.className = 'wishlist-card';
                card.innerHTML = `
                    <img src="${product.img}" alt="${product.name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1523170335258-f5ed11844a49?q=80&w=1200';">
                    <div class="wishlist-content">
                        <h2>${product.name}</h2>
                        <div class="meta">
                            <span>${product.category}</span>
                            <span class="price">${new Intl.NumberFormat('en-IN', {style:'currency',currency:'INR',maximumFractionDigits:0}).format(product.price)}</span>
                        </div>
                        <p>${product.desc}</p>
                        <div class="wishlist-actions">
                            <button class="wishlist-btn btn-remove" onclick="removeFromWishlist(${product.id})">Remove</button>
                            <button class="wishlist-btn btn-back" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                    </div>
                `;
                wishlistGrid.appendChild(card);
            });
        }

        renderWishlist();
    </script>
    <script src="./js/backend.js"></script>
</body>
</html>
