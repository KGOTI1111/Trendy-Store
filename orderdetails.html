<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy Store | Order Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #121212;
            --accent: #b89047;
            --bg: #fbfbfd;
            --text-main: #222222;
            --text-muted: #666666;
            --line: rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #f9efe2 0%, var(--bg) 100%); color: var(--text-main); }
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--line); }
        .logo { color: var(--primary); font: 700 26px 'Playfair Display', serif; text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-main); font-size: 13px; font-weight: 700; text-decoration: none; text-transform: uppercase; }
        .nav-links a:hover { color: var(--accent); }
        main { width: min(900px, calc(100% - 32px)); margin: 40px auto 64px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--text-main); font-size: 13px; font-weight: 700; text-decoration: none; }
        .back-link:hover { color: var(--accent); }
        .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
        h1 { font: 700 30px 'Playfair Display', serif; }
        .order-date { margin-top: 6px; color: var(--text-muted); font-size: 13px; }
        .order-status { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; background: #e8f3eb; color: #287043; font-size: 12px; font-weight: 700; }
        .order-section { margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: white; }
        .order-section h2 { margin-bottom: 18px; font-size: 17px; }
        .product-list { display: grid; }
        .product-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
        .product-image { width: 92px; height: 92px; object-fit: cover; border-radius: 8px; background: #f1f1f1; }
        .product-name { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
        .product-amount { white-space: nowrap; font-size: 14px; font-weight: 700; }
        .order-cost-breakdown { max-width: 420px; margin: 16px 0 0 auto; }
        .order-total { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; padding-top: 16px; border-top: 2px solid var(--accent); font-weight: 800; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; }
        .detail-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
        .detail-row strong { color: var(--text-muted); font-weight: 600; }
        .detail-row span { text-align: right; overflow-wrap: anywhere; }
        .empty-state { padding: 28px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--text-muted); }
        @media (max-width: 600px) {
            nav { padding: 16px; }
            .logo { font-size: 22px; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 11px; }
            main { margin-top: 24px; }
            .page-heading { flex-direction: column; }
            .order-section { padding: 18px; }
            .product-row { grid-template-columns: 68px minmax(0, 1fr); gap: 12px; }
            .product-image { width: 68px; height: 68px; }
            .product-amount { grid-column: 2; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="./index.html" class="logo">Trendy Store<span></span></a>
        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./profile.html">Profile</a>
        </div>
    </nav>

    <main>
        <a href="./profile.html?tab=orders" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to orders</a>
        <div id="orderContent"></div>
    </main>

    <script>
        function appendDetail(container, label, value) {
            const row = document.createElement('div');
            row.className = 'detail-row';
            const name = document.createElement('strong');
            name.textContent = label;
            const detail = document.createElement('span');
            detail.textContent = value === null || value === undefined || value === '' ? 'Not provided' : String(value);
            row.append(name, detail);
            container.appendChild(row);
        }

        function formatChoice(value) {
            if (!value) return 'Not provided';
            const label = String(value).replace(/([A-Z])/g, ' $1').replace(/[_-]/g, ' ');
            return label.charAt(0).toUpperCase() + label.slice(1);
        }

        function formatAmount(value) {
            const amount = Number(value);
            return Number.isFinite(amount)
                ? new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount)
                : String(value || 'Unavailable');
        }

        function getOrderCostBreakdown(order) {
            const subtotalAmount = (Array.isArray(order.items) ? order.items : [])
                .reduce((sum, item) => sum + (Number(item?.price) || 0) * (Number(item?.quantity) || 1), 0);
            const shippingAmount = Number(order.shippingCost) || 0;
            const taxAmount = Number(order.tax) || Math.round(subtotalAmount * 0.05 * 100) / 100;

            return {
                subtotal: formatAmount(order.subtotal ?? subtotalAmount),
                shipping: shippingAmount ? formatAmount(shippingAmount) : 'Free',
                tax: formatAmount(taxAmount),
                total: formatAmount(order.total ?? subtotalAmount + shippingAmount + taxAmount)
            };
        }

        function showUnavailable(message) {
            const emptyState = document.createElement('p');
            emptyState.className = 'empty-state';
            emptyState.textContent = message;
            document.getElementById('orderContent').replaceChildren(emptyState);
        }

        async function renderOrder() {
            const orderId = Number(new URLSearchParams(window.location.search).get('orderId'));
            if (!Number.isInteger(orderId) || orderId < 1) {
                showUnavailable('This order could not be found for your account.');
                return;
            }
            let result;
            try {
                const response = await fetch('./api/orders.php', { credentials: 'same-origin', cache: 'no-store' });
                result = await response.json();
                if (!response.ok || result.success !== true) {
                    throw new Error(result.message || 'Order details could not be loaded.');
                }
            } catch (error) {
                showUnavailable(error.message);
                return;
            }
            const order = result.data.find((item) => item.id === orderId);
            if (!order) {
                showUnavailable('This order could not be found for your account.');
                return;
            }

            const content = document.getElementById('orderContent');
            const heading = document.createElement('div');
            heading.className = 'page-heading';
            const titleBlock = document.createElement('div');
            const title = document.createElement('h1');
            title.textContent = 'Order details';
            const orderDate = order.date ? new Date(order.date) : null;
            const date = document.createElement('p');
            date.className = 'order-date';
            date.textContent = orderDate && !Number.isNaN(orderDate.getTime()) ? `Placed ${orderDate.toLocaleString()}` : 'Date unavailable';
            titleBlock.append(title, date);
            const status = document.createElement('span');
            status.className = 'order-status';
            status.textContent = order.status || 'Order placed';
            heading.append(titleBlock, status);

            const productSection = document.createElement('section');
            productSection.className = 'order-section';
            const productHeading = document.createElement('h2');
            productHeading.textContent = 'Products in this order';
            const productList = document.createElement('div');
            productList.className = 'product-list';
            (Array.isArray(order.items) ? order.items : []).forEach((item) => {
                const row = document.createElement('article');
                row.className = 'product-row';
                const image = document.createElement('img');
                image.className = 'product-image';
                image.alt = item?.name || 'Product';
                image.src = item?.img || '';
                image.addEventListener('error', () => { image.hidden = true; });
                const name = document.createElement('h3');
                name.className = 'product-name';
                name.textContent = item?.name || 'Product';
                const amount = document.createElement('p');
                amount.className = 'product-amount';
                amount.textContent = formatAmount((Number(item?.price) || 0) * (Number(item?.quantity) || 1));
                row.append(image, name, amount);
                productList.appendChild(row);
            });
            if (!productList.childElementCount) {
                const noItems = document.createElement('p');
                noItems.className = 'order-date';
                noItems.textContent = 'No product details are available for this order.';
                productList.appendChild(noItems);
            }
            const costs = getOrderCostBreakdown(order);
            const costBreakdown = document.createElement('div');
            costBreakdown.className = 'order-cost-breakdown';
            appendDetail(costBreakdown, 'Subtotal', costs.subtotal);
            appendDetail(costBreakdown, 'Shipping', costs.shipping);
            appendDetail(costBreakdown, 'Tax (5%)', costs.tax);
            const total = document.createElement('p');
            total.className = 'order-total';
            const totalLabel = document.createElement('span');
            totalLabel.textContent = 'Order total';
            const totalValue = document.createElement('span');
            totalValue.textContent = costs.total;
            total.append(totalLabel, totalValue);
            productSection.append(productHeading, productList, costBreakdown, total);

            const deliverySection = document.createElement('section');
            deliverySection.className = 'order-section';
            const deliveryHeading = document.createElement('h2');
            deliveryHeading.textContent = 'Delivery and payment';
            const detailGrid = document.createElement('div');
            detailGrid.className = 'detail-grid';
            const delivery = order.delivery || {};
            appendDetail(detailGrid, 'Order status', order.status || 'Order placed');
            [
                ['Name', delivery.name],
                ['Email', delivery.email],
                ['Phone', delivery.phone],
                ['Address', [delivery.address, delivery.area, delivery.city, delivery.state, delivery.zipcode, delivery.country].filter(Boolean).join(', ')],
                ['Shipping', formatChoice(order.shipping)],
                ['Payment', formatChoice(order.paymentMethod)]
            ].forEach(([label, value]) => appendDetail(detailGrid, label, value));
            if (order.paymentMethod === 'online') appendDetail(detailGrid, 'Online payment type', formatChoice(order.onlinePaymentType));
            deliverySection.append(deliveryHeading, detailGrid);

            content.replaceChildren(heading, productSection, deliverySection);
        }

        renderOrder();
    </script>
</body>
</html>
